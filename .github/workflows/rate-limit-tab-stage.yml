name: Verify rate-limit tab layout migration
on:
  push:
    branches:
      - feat/rate-limit-three-tabs
permissions:
  contents: write
jobs:
  apply-test-and-commit:
    if: "${{ github.event.head_commit.message == 'chore(dev): run rate-limit tab layout migration' }}"
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout source branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true
      - name: Apply targeted JSX move and CI coverage
        run: |
          python3 scripts/reorganize_rate_limit_tabs.py
          git diff --check
      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Install classic dependencies
        working-directory: web
        run: bun install --filter ./classic
      - name: Run UI regression tests
        working-directory: web/classic
        run: bun test src/pages/RateLimitManagement/tabLayout.test.js src/helpers/apiFailurePolicy.test.js src/pages/RateLimitManagement/userIdentifierPolicy.test.js
      - name: Build classic frontend
        working-directory: web/classic
        env:
          VITE_REACT_APP_VERSION: ci
        run: bun run build
      - name: Commit verified UI-only change
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add web/classic/src/pages/RateLimitManagement/index.jsx web/classic/src/pages/RateLimitManagement/tabLayout.test.js .github/workflows/ci.yml
          git commit -m 'refactor(ui): organize rate limits into three tabs'
          git push origin HEAD:feat/rate-limit-three-tabs

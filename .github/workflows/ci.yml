name: CI

on:
  push:
    branches:
      - main
    paths-ignore:
      - '**/*.md'
      - 'LICENSE'
      - 'NOTICE'
      - 'THIRD-PARTY-LICENSES.md'
  pull_request:
    branches:
      - main
    paths-ignore:
      - '**/*.md'
      - 'LICENSE'
      - 'NOTICE'
      - 'THIRD-PARTY-LICENSES.md'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend / Go test & build
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Prepare embedded frontend placeholder
        run: |
          mkdir -p web/classic/dist
          printf '<!doctype html><html><body>CI placeholder</body></html>\n' > web/classic/dist/index.html

      - name: Download Go modules
        run: go mod download

      - name: Run Go tests
        run: go test ./... -count=1

      - name: Compile backend
        run: go build ./...

  frontend-classic:
    name: Frontend / Classic build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: web

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install classic dependencies
        run: bun install --filter ./classic

      - name: Build classic frontend
        working-directory: web/classic
        env:
          VITE_REACT_APP_VERSION: ci
        run: bun run build

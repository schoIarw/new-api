name: Verify and apply user identifier prefix update
on:
  push:
    branches:
      - feat/user-identifier-prefix-release
permissions:
  contents: write
jobs:
  apply-and-verify:
    if: "${{ github.event.head_commit.message == 'chore(dev): stage identifier polish' }}"
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: true
          fetch-depth: 0
      - name: Apply follow-up fixes
        run: python3 scripts/polish_identifier_prefix.py
      - name: Format and inspect changes
        run: |
          gofmt -w middleware/model-rate-limit.go middleware/phone_rate_limit_test.go
          git diff --check
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Prepare embedded frontend placeholder
        run: |
          mkdir -p web/classic/dist
          printf '<!doctype html><html><body>CI placeholder</body></html>\n' > web/classic/dist/index.html
      - name: Go build and full test suite
        run: |
          go build ./...
          go test ./... -count=1
      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Install classic dependencies
        working-directory: web
        run: bun install --filter ./classic
      - name: Frontend tests and production build
        working-directory: web/classic
        run: |
          bun test src/pages/RateLimitManagement/userIdentifierPolicy.test.js src/helpers/apiFailurePolicy.test.js
          bun run build
      - name: Commit verified changes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add middleware/model-rate-limit.go middleware/phone_rate_limit_test.go web/classic/src/pages/RateLimitManagement/PhoneRateLimit.jsx web/classic/src/pages/RateLimitManagement/index.jsx docs/phone-rate-limit.md
          git commit -m 'fix(rate-limit): preserve arbitrary identifier strings and clarify prefix UI'
          git push origin HEAD:feat/user-identifier-prefix-release
